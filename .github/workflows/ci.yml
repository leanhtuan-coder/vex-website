name: Website checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run preview > /tmp/vex-preview.log 2>&1 &
      - run: npm run verify:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-qa
          path: artifacts/
          retention-days: 14
